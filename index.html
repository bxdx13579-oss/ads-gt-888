<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdsPower 控制面板</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #eee; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        input, button, select { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #0051a2; }
        .result { margin-top: 20px; padding: 15px; background: #222; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AdsPower 控制面板</h1>
        
        <label>環境 ID（user_id）</label>
        <input type="text" id="accountId" placeholder="例如：k1iyj8sm" value="k1iyj8sm">

        <label>要開啟的網址</label>
        <input type="text" id="targetUrl" placeholder="貼上網址，例如：https://www.threads.net/search?q=關鍵字">

        <button onclick="sendTask('open')">開啟瀏覽器</button>
        <button onclick="sendTask('close')">關閉瀏覽器</button>
        <button onclick="sendTask('open_url')">開啟指定頁面</button>

        <div class="result" id="result">等待指令...</div>
    </div>

    <script>
        async function sendTask(type) {
            const accountId = document.getElementById('accountId').value.trim();
            const targetUrl = document.getElementById('targetUrl').value.trim();

            if (!accountId) {
                alert("請輸入環境 ID");
                return;
            }

            if (type === 'open_url' && !targetUrl) {
                alert("請輸入要開啟的網址");
                return;
            }

            document.getElementById('result').textContent = "正在送出任務...";

            try {
                const response = await fetch('/api/task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        type, 
                        account_id: accountId,
                        content: targetUrl 
                    })
                });
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('result').textContent = "錯誤：" + err.message;
            }
        }
    </script>
</body>
</html>
